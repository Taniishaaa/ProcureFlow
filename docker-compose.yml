# Starts PostgreSQL, the Spring Boot API and the React UI.
#   docker compose up --build
# UI:       http://localhost:3000
# API docs: http://localhost:8080/swagger-ui.html
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-procureflow}
      POSTGRES_USER: ${DB_USERNAME:-procureflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-procureflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-procureflow} -d ${DB_NAME:-procureflow}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-procureflow}
      DB_USERNAME: ${DB_USERNAME:-procureflow}
      DB_PASSWORD: ${DB_PASSWORD:-procureflow}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789-abcdefghijklmnopqrstuvwxyz}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SEED_ENABLED: ${SEED_ENABLED:-true}
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA:-true}
      SEED_PASSWORD: ${SEED_PASSWORD:-Password@123}
      EXPOSE_RESET_TOKEN: ${EXPOSE_RESET_TOKEN:-true}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
